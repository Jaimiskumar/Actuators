[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logdetective"
version = "0.1.0"
description = "Terminal-Native Log Detective: Fast, memory-flat error clustering & crash timeline reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Log Detective Team"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "psutil>=5.9.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pytest>=7.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
logdetective = "logdetective.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["logdetective*"]
